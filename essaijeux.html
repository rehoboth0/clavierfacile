<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clavier Facile — Apprendre à taper</title>
<style>
  body { font-family: Arial, sans-serif; background:#0b2545; color:#fff; text-align:center; margin:0; padding:20px; }
  .carte { background:#13315c; padding:20px; border-radius:16px; max-width:700px; margin:auto; }
  h1 { color:#ffd166; }
  .cible { font-size:42px; font-weight:bold; color:#8ecae6; min-height:60px; }
  input { font-size:28px; padding:10px; width:280px; text-align:center; border-radius:10px; border:none; }
  button { background:#ffd166; border:none; padding:12px 20px; border-radius:10px; font-size:18px; cursor:pointer; margin:8px; }
  .stats { display:flex; justify-content:center; gap:20px; margin-top:15px; font-size:18px; }
  .bon { color:#7ee787; }
  .faux { color:#ff6b6b; }
</style>
</head>
<body>

<div class="carte">
  <h1>Clavier Facile</h1>
  <p>Apprends à taper avec les doigts, lettre par lettre.</p>

  <p>Appuie sur la touche affichée :</p>
  <div class="cible" id="cible">A</div>

  <input id="saisie" autofocus placeholder="Tape ici…">

  <div class="stats">
    <div>Score : <span id="score">0</span></div>
    <div>Erreurs : <span id="erreurs">0</span></div>
    <div>Précision : <span id="precision">100%</span></div>
  </div>

  <button onclick="nouvelleLettre()">Nouvelle lettre</button>
  <button onclick="recommencer()">Recommencer</button>
</div>

<script>
const lettres = "AZERTYUIOPQSDFGHJKLMWXCVBN".split("");
let score = 0, erreurs = 0, total = 0, cible = "";

function nouvelleLettre() {
  cible = lettres[Math.floor(Math.random() * lettres.length)];
  document.getElementById("cible").textContent = cible;
  document.getElementById("saisie").value = "";
  document.getElementById("saisie").focus();
}

function mettreAJour() {
  document.getElementById("score").textContent = score;
  document.getElementById("erreurs").textContent = erreurs;
  const precision = total === 0 ? 100 : Math.round((total - erreurs) / total * 100);
  document.getElementById("precision").textContent = precision + "%";
}

document.getElementById("saisie").addEventListener("input", e => {
  const valeur = e.target.value.toUpperCase();
  if (!valeur) return;
  total++;

  if (valeur === cible) {
    score++;
    document.getElementById("cible").className = "cible bon";
  } else {
    erreurs++;
    document.getElementById("cible").className = "cible faux";
  }

  mettreAJour();
  setTimeout(nouvelleLettre, 400);
});

function recommencer() {
  score = 0; erreurs = 0; total = 0;
  mettreAJour();
  nouvelleLettre();
}

nouvelleLettre();
</script>

</body>
</html>
